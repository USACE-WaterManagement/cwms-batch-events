<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">CWMS Batch Events failed-job email notification flow</title>
  <desc id="desc">Configuration and runtime flow showing CDA user lists, manual recipients, template rendering, SQS queueing, and the notification worker boundary.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="batch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f8f3"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="queue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16324f" flood-opacity=".13"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#059669"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 31px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #102a43; }
      .subtitle { font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52677b; }
      .lane-title { font: 700 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #183b56; letter-spacing: .02em; }
      .step { font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #102a43; }
      .body { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #40566b; }
      .small { font: 500 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #60758a; }
      .pill { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .04em; }
      .box { stroke-width: 1.5; filter: url(#shadow); }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1440" height="920" fill="url(#page)"/>

  <text x="56" y="55" class="title">Failed-job email notification flow</text>
  <text x="56" y="82" class="subtitle">CDA owns reusable user lists; Batch Events owns notification rules, rendering, and delivery handoff.</text>

  <!-- Configuration lane -->
  <rect x="42" y="112" width="1356" height="250" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="42" y="112" width="1356" height="47" rx="20" fill="#eaf1f8"/>
  <path d="M42 139v20h1356v-20" fill="#eaf1f8"/>
  <text x="66" y="142" class="lane-title">1 · CONFIGURE THE RULE</text>

  <rect x="72" y="187" width="215" height="126" rx="14" fill="#fff" stroke="#94a3b8" class="box"/>
  <circle cx="103" cy="217" r="15" fill="#334155"/>
  <path d="M96 218a7 7 0 1 1 14 0M92 237c2-8 20-8 22 0" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="129" y="221" class="step">Logged-in admin</text>
  <text x="92" y="252" class="body">Opens the script’s</text>
  <text x="92" y="272" class="body">notification editor.</text>
  <rect x="92" y="286" width="123" height="19" rx="9" fill="#dbeafe"/>
  <text x="103" y="300" class="pill" fill="#1d4ed8">USER BEARER TOKEN</text>

  <path d="M287 250H347" class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)"/>

  <rect x="348" y="177" width="320" height="146" rx="14" fill="url(#batch)" stroke="#60a5fa" class="box"/>
  <text x="372" y="207" class="step">Batch Events UI</text>
  <text x="372" y="233" class="body">Select a CDA user list</text>
  <text x="372" y="253" class="body">and/or enter manual email addresses.</text>
  <text x="372" y="281" class="body">Enable email on failure and</text>
  <text x="372" y="301" class="body">choose one canonical template.</text>

  <path d="M668 216H735" class="arrow" stroke="#059669" marker-end="url(#arrow-green)"/>
  <text x="684" y="203" class="small">GET lists</text>

  <rect x="736" y="177" width="280" height="146" rx="14" fill="url(#cda)" stroke="#34d399" class="box"/>
  <text x="760" y="207" class="step">CDA user-list API</text>
  <text x="760" y="234" class="body">Returns reusable lists for</text>
  <text x="760" y="254" class="body">the script office.</text>
  <text x="760" y="282" class="body">If none exist, the UI links to</text>
  <text x="760" y="302" class="body">CDA’s User Lists page.</text>

  <path d="M668 286C774 346 1016 346 1080 286" class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <text x="810" y="345" class="small">Save rule through Batch Events API</text>

  <rect x="1081" y="177" width="281" height="146" rx="14" fill="#f8fafc" stroke="#94a3b8" class="box"/>
  <text x="1105" y="207" class="step">Batch Events database</text>
  <text x="1105" y="234" class="body">Stores:</text>
  <text x="1120" y="255" class="body">• CDA user-list ID</text>
  <text x="1120" y="275" class="body">• manual recipients</text>
  <text x="1120" y="295" class="body">• template + enabled state</text>

  <!-- Runtime lane -->
  <rect x="42" y="390" width="1356" height="400" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="42" y="390" width="1356" height="47" rx="20" fill="#eaf1f8"/>
  <path d="M42 417v20h1356v-20" fill="#eaf1f8"/>
  <text x="66" y="420" class="lane-title">2 · RESOLVE, RENDER, AND QUEUE</text>

  <rect x="72" y="478" width="184" height="102" rx="14" fill="#fff1f2" stroke="#fb7185" class="box"/>
  <circle cx="101" cy="507" r="15" fill="#e11d48"/>
  <path d="M101 497v13M101 518v1" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="126" y="512" class="step">Job fails</text>
  <text x="92" y="544" class="body">Status changes to</text>
  <text x="92" y="564" class="body">FAILED.</text>

  <path d="M256 529H316" class="arrow" stroke="#475569" marker-end="url(#arrow-gray)"/>

  <rect x="317" y="468" width="234" height="122" rx="14" fill="url(#batch)" stroke="#60a5fa" class="box"/>
  <text x="341" y="500" class="step">Load active rule</text>
  <text x="341" y="527" class="body">Batch Events loads the script’s</text>
  <text x="341" y="547" class="body">active failed-job rule and</text>
  <text x="341" y="567" class="body">notification template.</text>

  <path d="M551 508H623" class="arrow" stroke="#059669" marker-end="url(#arrow-green)"/>
  <text x="563" y="495" class="small">list ID</text>

  <rect x="624" y="454" width="278" height="150" rx="14" fill="url(#cda)" stroke="#34d399" class="box"/>
  <text x="648" y="486" class="step">Resolve CDA members</text>
  <text x="648" y="513" class="body">GET /user/list/{id}/members</text>
  <text x="648" y="535" class="body">for the job’s office.</text>
  <rect x="648" y="553" width="150" height="20" rx="10" fill="#bbf7d0"/>
  <text x="660" y="567" class="pill" fill="#047857">CDA BEARER TOKEN</text>
  <text x="648" y="591" class="small">Registered service-account credential</text>

  <path d="M551 566C593 625 645 650 704 650" class="arrow" stroke="#475569" marker-end="url(#arrow-gray)"/>
  <text x="555" y="622" class="small">manual emails</text>
  <path d="M763 604V650" class="arrow" stroke="#059669" marker-end="url(#arrow-green)"/>
  <text x="777" y="632" class="small">member emails</text>

  <rect x="704" y="651" width="198" height="98" rx="14" fill="#f8fafc" stroke="#94a3b8" class="box"/>
  <text x="728" y="682" class="step">Merge + deduplicate</text>
  <text x="728" y="709" class="body">Combine both sources,</text>
  <text x="728" y="729" class="body">remove duplicates and blanks.</text>

  <path d="M902 700H965" class="arrow" stroke="#475569" marker-end="url(#arrow-gray)"/>

  <rect x="966" y="468" width="214" height="122" rx="14" fill="url(#batch)" stroke="#60a5fa" class="box"/>
  <text x="990" y="500" class="step">Render message</text>
  <text x="990" y="527" class="body">Jinja template receives job,</text>
  <text x="990" y="547" class="body">script, office, error, and</text>
  <text x="990" y="567" class="body">log context.</text>
  <path d="M902 683C948 662 1015 630 1068 590" class="arrow" stroke="#475569" marker-end="url(#arrow-gray)"/>

  <path d="M1180 529H1230" class="arrow" stroke="#475569" marker-end="url(#arrow-gray)"/>

  <rect x="1231" y="468" width="131" height="122" rx="14" fill="url(#queue)" stroke="#f59e0b" class="box"/>
  <text x="1261" y="500" class="step">SQS</text>
  <text x="1251" y="527" class="body">Rendered</text>
  <text x="1251" y="547" class="body">email v1.1</text>
  <text x="1251" y="567" class="body">envelope.</text>

  <path d="M1296 590V666" class="arrow" stroke="#f59e0b" marker-end="url(#arrow-gray)"/>

  <rect x="1050" y="667" width="312" height="82" rx="14" fill="#fff7ed" stroke="#fb923c" class="box"/>
  <text x="1074" y="698" class="step">Generic email worker</text>
  <text x="1074" y="720" class="body">Validates the rendered envelope and delivers</text>
  <text x="1074" y="740" class="body">through the local log sink or production SES.</text>

  <!-- Failure note -->
  <path d="M624 529H588V775H1070" class="arrow dash" stroke="#be123c" marker-end="url(#arrow-gray)"/>
  <rect x="72" y="690" width="465" height="59" rx="12" fill="#fff1f2" stroke="#fda4af"/>
  <text x="92" y="715" class="step" fill="#9f1239">Fail closed on CDA lookup errors</text>
  <text x="92" y="736" class="body">A missing worker API key or failed CDA request prevents an incomplete list send.</text>

  <!-- Legend -->
  <rect x="42" y="817" width="1356" height="70" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="68" y="839" width="18" height="18" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="96" y="853" class="body">Batch Events</text>
  <rect x="232" y="839" width="18" height="18" rx="4" fill="#d1fae5" stroke="#34d399"/>
  <text x="260" y="853" class="body">CDA</text>
  <rect x="342" y="839" width="18" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="370" y="853" class="body">Queue / delivery boundary</text>
  <line x1="588" y1="848" x2="626" y2="848" class="arrow" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <text x="640" y="853" class="body">Browser bearer-token request</text>
  <line x1="867" y1="848" x2="905" y2="848" class="arrow" stroke="#059669" marker-end="url(#arrow-green)"/>
  <text x="919" y="853" class="body">CDA API request</text>
  <text x="1151" y="853" class="small">Implemented branch: 157-add-alert-ad-hoc-email-queue</text>
</svg>
