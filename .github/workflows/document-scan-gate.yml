name: Document scanner compatibility
on:
  pull_request:
    paths:
      - "scanner/**"
      - "integration/document_scans/**"
      - "cwms_batch_events/core/document_*.py"
      - "cwms_batch_events/api/routers/document_scan.py"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/document-scan-gate.yml"
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install reportlab==5.0.1
      - run: python integration/document_scans/run_gate.py "${RUNNER_TEMP}/scan-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-scanner-evidence
          path: ${{ runner.temp }}/scan-evidence
