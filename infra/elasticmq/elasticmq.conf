# From example at https://github.com/softwaremill/elasticmq

include classpath("application.conf")

# What is the outside visible address of this ElasticMQ node
# Used to create the queue URL (may be different from bind address!)
node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Possible values: relaxed, strict
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

# Should the node-address be generated from the bind port/hostname
# Set this to true e.g. when assigning port automatically by using port 0.
generate-node-address = false

queues {
  cwms-batch-events {}
  cwms-batch-events-notifications-dead-letter {}
  cwms-batch-events-notifications {
    deadLettersQueue {
      name = "cwms-batch-events-notifications-dead-letter"
      maxReceiveCount = 3
    }
  }
}
